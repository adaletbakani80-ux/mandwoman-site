<!doctype html>
<html lang="tr" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>MANDWOMAN · TikTok LIVE Yayıncı Ajansı</title>
<meta name="description" content="MANDWOMAN, TikTok Türkiye resmi partner yayıncı ajansı. Birebir menajer, eğitim, etkinlikler ve oyun yayıncılarına ücretsiz interaktif oyun kurulumu. Ücretsiz başvur.">
<meta name="theme-color" content="#07080B">
<meta property="og:type" content="website">
<meta property="og:title" content="MANDWOMAN · TikTok LIVE Yayıncı Ajansı">

<link rel="icon" type="image/svg+xml" href="favicon.svg">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>/* MANDWOMAN – web sitesi */
:root{--acc:#C6F432;--bg:#07080B;--panel:#0E1016;--kart:#12151C;--cizgi:#222632;--cizgi2:#2A2F3C;--yazi:#F2F3F5;--soluk:#AEB4C0;--soluk2:#9DA3B0;--kirmizi:#E5243B}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--yazi);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
a{color:var(--acc)}a:hover{color:#E2FF8A}
button{font:inherit}
input,select,textarea{font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
[hidden]{display:none!important}

.kok{position:relative;height:100vh;height:100dvh;min-height:560px;overflow:hidden;background:var(--bg)}
.sahne{position:absolute;inset:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.hovering .sahne{cursor:pointer}
.dragging .sahne{cursor:grabbing}
.sahne-isik{position:absolute;left:50%;top:58%;width:1500px;height:700px;margin-left:-750px;margin-top:-350px;background:radial-gradient(closest-side,rgba(120,140,255,.10),rgba(7,8,11,0));pointer-events:none}
#duvar{position:absolute;inset:0;width:100%;height:100%;display:block}
.glyok{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:420px;text-align:center;color:var(--soluk);font-size:15px;line-height:1.6;padding:0 20px}
.ust-golge{position:absolute;left:0;right:0;top:0;height:150px;background:linear-gradient(var(--bg) 20%,rgba(7,8,11,0));pointer-events:none}
.alt-golge{position:absolute;left:0;right:0;bottom:0;height:320px;background:linear-gradient(rgba(7,8,11,0),rgba(7,8,11,.86) 55%,var(--bg) 92%);pointer-events:none}

/* Üst bar */
.bas{position:absolute;top:0;left:0;right:0;z-index:20;padding:22px 32px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;pointer-events:none}
.menu{display:flex;flex-wrap:wrap;align-items:center;gap:2px;pointer-events:auto}
.navlink{position:relative;min-height:44px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:#C9CDD6;font-size:14px;font-weight:600;cursor:pointer;transition:color .25s}
.navlink::after{content:'';position:absolute;left:14px;right:14px;bottom:7px;height:2px;border-radius:2px;background:var(--acc);transform:scaleX(0);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.navlink:hover,.navlink:focus-visible{color:#fff}
.navlink:hover::after,.navlink:focus-visible::after{transform:scaleX(1)}
.menu-btn{display:none;pointer-events:auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--cizgi2);background:rgba(14,16,22,.7);color:var(--yazi);align-items:center;justify-content:center;cursor:pointer}
.mw-logo{display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:auto;text-decoration:none}
.mw-mark{transition:filter .4s}
.mw-mark path{stroke-dasharray:700;stroke-dashoffset:700;animation:mwDraw 1.5s cubic-bezier(.65,0,.35,1) forwards;transition:stroke .4s}
.mw-mark path:nth-child(1){animation-delay:.15s}.mw-mark path:nth-child(2){animation-delay:.4s}.mw-mark path:nth-child(3){animation-delay:.65s}
@keyframes mwDraw{to{stroke-dashoffset:0}}
.mw-logo:hover .mw-mark{filter:drop-shadow(0 0 8px rgba(198,244,50,.55))}
.mw-logo:hover .mw-mark path{stroke:var(--acc)}
.mw-word{display:block;-webkit-mask-image:linear-gradient(100deg,rgba(0,0,0,.55) 42%,#000 50%,rgba(0,0,0,.55) 58%);mask-image:linear-gradient(100deg,rgba(0,0,0,.55) 42%,#000 50%,rgba(0,0,0,.55) 58%);-webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-position:100% 0;mask-position:100% 0;animation:mwShine 7s ease-in-out 1.6s infinite}
@keyframes mwShine{0%{-webkit-mask-position:100% 0;mask-position:100% 0}35%,100%{-webkit-mask-position:0 0;mask-position:0 0}}
.bas-sag{display:flex;justify-content:flex-end;pointer-events:auto}
.hd-in{animation:hdIn .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0s)}
@keyframes hdIn{from{opacity:0;transform:translateY(-10px)}}

.cta{min-height:44px;padding:0 20px;border-radius:999px;border:none;background:var(--acc);color:#0A0B0F;font-size:14px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.cta:hover{filter:brightness(1.08);color:#0A0B0F}
.cta-fx{position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s;animation:ctaPulse 3.2s ease-out 2s infinite}
.cta-fx::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));transform:skewX(-20deg);animation:ctaShine 5s ease-in-out 2.4s infinite;pointer-events:none}
.cta-fx:hover{transform:translateY(-1px);box-shadow:0 8px 24px -6px rgba(198,244,50,.55)}
@keyframes ctaPulse{0%{box-shadow:0 0 0 0 rgba(198,244,50,.5)}70%,100%{box-shadow:0 0 0 12px rgba(198,244,50,0)}}
@keyframes ctaShine{0%{left:-60%}30%,100%{left:130%}}
.cta.buyuk{min-height:52px;padding:0 24px;border-radius:14px;font-size:15px}
.dugme2{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--cizgi2);background:transparent;color:var(--yazi);font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap}
.dugme2:hover{border-color:#4A505E;color:#fff;background:rgba(255,255,255,.04)}
.dugme2.beyaz{border-color:var(--yazi)}
.dugme2.buyuk{min-height:52px;border-radius:14px;font-size:15px;padding:0 20px}

/* Giriş metni */
.giris{position:absolute;left:36px;bottom:64px;z-index:20;max-width:540px;display:flex;flex-direction:column;gap:12px;pointer-events:none}
.rozet{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;border:1px solid rgba(198,244,50,.45);background:rgba(198,244,50,.08);color:var(--acc);font-size:12px;font-weight:800;letter-spacing:.04em}
.rozet-tik{width:20px;height:20px;border-radius:50%;background:var(--acc);color:#0A0B0F;display:flex;align-items:center;justify-content:center}
.giris h1{margin:0;font-family:Unbounded,sans-serif;font-weight:600;font-size:40px;line-height:1.08;letter-spacing:-.02em}
.giris p{margin:0;font-size:15px;line-height:1.55;color:var(--soluk)}
.ipucu{position:absolute;right:36px;bottom:30px;z-index:20;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--soluk);pointer-events:none}
.guven{position:absolute;left:36px;bottom:30px;z-index:20;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--soluk)}
.canli-nokta{width:8px;height:8px;border-radius:50%;background:var(--kirmizi);animation:blink 1.3s infinite;flex-shrink:0}
.onizleme-etiket{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:20;font-size:11px;font-weight:800;letter-spacing:.06em;color:#F5C451;border:1px dashed #6B5A22;border-radius:999px;padding:4px 10px;background:rgba(7,8,11,.7)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* Paneller */
.ov{position:absolute;inset:0;z-index:50;background:rgba(4,5,8,.74);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:28px;animation:fade .3s both}
.panel{position:relative;width:100%;max-width:1120px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--cizgi);border-radius:22px;padding:36px;box-shadow:0 60px 140px -30px rgba(0,0,0,.9);animation:pop .45s cubic-bezier(.2,.8,.2,1) both;outline:none;overscroll-behavior:contain}
.kapat{position:absolute;z-index:10;top:18px;right:18px;width:44px;height:44px;border-radius:50%;border:1px solid var(--cizgi2);background:#151821;color:#E7E9EE;cursor:pointer;display:flex;align-items:center;justify-content:center}
.kapat:hover{background:#1D212C}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}

.ust-yazi{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--acc)}
.p-bas{display:flex;flex-direction:column;gap:12px;padding-right:48px}
.p-bas h2{margin:0;font-family:Unbounded,sans-serif;font-size:34px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.p-bas p{margin:0;font-size:16px;line-height:1.6;color:var(--soluk)}
.dikey{display:flex;flex-direction:column;gap:28px}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px}
.kart .no{font-family:Unbounded,sans-serif;font-size:13px;font-weight:600;color:var(--acc)}
.kart .bas2{font-size:17px;font-weight:700}
.kart .acik{font-size:14px;line-height:1.5;color:var(--soluk)}
.izgara{display:grid;gap:12px}
.i2{grid-template-columns:repeat(2,minmax(0,1fr))}
.i3{grid-template-columns:repeat(3,minmax(0,1fr))}
.i4{grid-template-columns:repeat(4,minmax(0,1fr))}
.adim-no{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#0A0B0F;font-weight:800;display:flex;align-items:center;justify-content:center}
.buyuk-rakam{font-family:Unbounded,sans-serif;font-size:34px;font-weight:700;color:var(--acc);line-height:1.1}
h3.alt-bas{margin:0;font-size:15px;font-weight:700}
h3.alt-bas small{font-weight:500;color:var(--soluk2);font-size:12px}

/* Kurucu */
.kurucu{display:flex;flex-wrap:wrap;gap:24px;padding:22px;border-radius:18px;border:1px solid var(--cizgi);background:#10131A}
.kurucu-foto{flex:0 0 200px;display:flex;flex-direction:column;gap:10px}
.kurucu-foto .cerceve{aspect-ratio:4/5;border-radius:14px;border:1px solid var(--cizgi2);background:radial-gradient(120% 80% at 50% 0%,rgba(198,244,50,.10),rgba(198,244,50,0) 60%),#0B0D12;display:flex;align-items:center;justify-content:center;overflow:hidden}
.kurucu-foto img{width:100%;height:100%;object-fit:cover;display:block}
.kurucu-foto .alt{font-size:13px;color:var(--soluk)}
.kurucu-foto .alt b{color:var(--yazi)}
.kurucu-metin{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:12px}
.kurucu-metin h3{margin:0;font-family:Unbounded,sans-serif;font-size:26px;font-weight:600}
.kurucu-metin p{margin:0;font-size:15px;line-height:1.65;color:#C3C8D2}
.alinti{margin:4px 0 0;padding:12px 16px;border-left:3px solid var(--acc);background:rgba(198,244,50,.05);border-radius:0 12px 12px 0;font-size:16px;line-height:1.55;font-style:italic;color:var(--yazi)}
.zaman{flex:1 1 100%;margin:4px 0 0;padding:18px 0 0;list-style:none;border-top:1px solid var(--cizgi);display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px}
.zaman li{display:flex;flex-direction:column;gap:6px}
.zaman .yil{display:flex;align-items:center;gap:8px;font-family:Unbounded,sans-serif;font-size:13px;font-weight:600}
.zaman .yil::before{content:'';width:10px;height:10px;border-radius:50%;background:#3A4050;flex-shrink:0}
.zaman li:last-child .yil{color:var(--acc)}
.zaman li:last-child .yil::before{background:var(--acc)}
.zaman .olay{font-size:13px;line-height:1.45;color:#C3C8D2}

/* Yayıncı paneli */
.yay{display:flex;flex-wrap:wrap;gap:32px}
.yay-video-kol{flex:0 1 380px;min-width:240px;display:flex;flex-direction:column;gap:10px}
.yay-video{position:relative;aspect-ratio:4/5;max-height:72vh;border-radius:18px;overflow:hidden;border:1px solid var(--cizgi);background:#0B0D12}
.yay-video video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.yay-video .etiketler{position:absolute;top:14px;left:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.etiket-canli{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:6px;background:var(--kirmizi);color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em}
.etiket-canli i{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.3s infinite}
.etiket-son{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:6px;background:rgba(10,11,15,.72);color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em}
.etiket-son i{width:7px;height:7px;border-radius:50%;background:var(--acc)}
.etiket-izl{font-size:12px;font-weight:600;background:rgba(0,0,0,.5);padding:4px 9px;border-radius:6px}
.yay-video .ses{position:absolute;right:12px;bottom:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.yay-video .bos{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.kesit-sec{display:flex;gap:8px;flex-wrap:wrap}
.kesit-sec button{min-width:44px;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--cizgi2);background:transparent;color:var(--soluk);font-weight:700;font-size:13px;cursor:pointer}
.kesit-sec button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
.yay-bilgi{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:22px}
.hap{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#1B1F29;color:#D5D9E1}
.hap.acc{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.hap.ornek{background:transparent;border:1px dashed #4A505E;color:var(--soluk)}
.yay-bilgi h2{margin:0;font-family:Unbounded,sans-serif;font-size:30px;font-weight:600;letter-spacing:-.01em;word-break:break-word}
.yay-bilgi .hikaye{margin:0;font-size:15px;line-height:1.6;color:var(--soluk);white-space:pre-line}
.ist{background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.ist .et{font-size:12px;color:var(--soluk2);font-weight:600}
.ist .deg{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ist .once{font-size:13px;color:#8A909D;text-decoration:line-through}
.ist .simdi{font-size:22px;font-weight:800;letter-spacing:-.01em}
.ist .fark{align-self:flex-start;font-size:12px;font-weight:800;color:#0A0B0F;background:var(--acc);padding:2px 8px;border-radius:999px}
.kiyas{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.kiyas-sat{display:flex;align-items:center;gap:12px;font-size:13px}
.kiyas-sat .ad{width:96px;color:var(--soluk);flex-shrink:0}
.kiyas-sat .cubuk{flex:1;height:12px;border-radius:99px;background:#1B1F29;overflow:hidden}
.kiyas-sat .cubuk span{display:block;height:100%;border-radius:99px;background:#4A505E;transform-origin:left;animation:uza .9s cubic-bezier(.2,.8,.2,1) .2s both}
.kiyas-sat.simdi .cubuk span{background:var(--acc)}
.kiyas-sat .say{width:64px;text-align:right;font-weight:800}
@keyframes uza{from{transform:scaleX(0)}}
.km{display:flex;gap:12px;align-items:baseline}
.km .t{width:64px;flex-shrink:0;font-size:12px;font-weight:800;color:var(--acc)}
.km .x{font-size:14px;color:#D5D9E1;line-height:1.45}
.satir-dugme{display:flex;align-items:center;gap:16px;min-height:60px;padding:10px 16px;border-radius:14px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);cursor:pointer;text-align:left;width:100%;transition:background .2s,border-color .2s}
.satir-dugme:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.2)}
.satir-dugme .renk{width:40px;height:40px;border-radius:10px;flex-shrink:0;overflow:hidden}
.satir-dugme .renk video{width:100%;height:100%;object-fit:cover;display:block}
.satir-dugme .ic{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.satir-dugme .ic b{font-size:15px}
.satir-dugme .ic span{font-size:12px;color:var(--soluk2)}
.satir-dugme .fark{font-size:13px;font-weight:800;color:#0A0B0F;background:var(--acc);padding:4px 10px;border-radius:999px;white-space:nowrap}

/* Oyun paketi */
.oyun{display:flex;flex-wrap:wrap;gap:32px;align-items:stretch}
.oyun-sol{flex:1 1 460px;min-width:0;display:flex;flex-direction:column;gap:22px}
.oyun-video{flex:0 1 300px;min-width:240px;align-self:flex-start;margin-top:56px;position:relative;aspect-ratio:4/5;border-radius:18px;overflow:hidden;border:1px solid var(--cizgi);background:#0B0D12}
.oyun-video video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.oyun-video .bos{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.dahil{display:flex;gap:12px;align-items:flex-start;background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.45;font-weight:600}
.tik{width:26px;height:26px;border-radius:50%;flex-shrink:0;background:var(--acc);color:#0A0B0F;display:flex;align-items:center;justify-content:center}
.nasil{display:flex;gap:14px;align-items:flex-start}
.nasil .n{width:30px;height:30px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--acc);color:var(--acc);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.nasil b{display:block;font-size:15px}
.nasil span{font-size:14px;line-height:1.5;color:var(--soluk)}
.gerek{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gerek div{background:#151922;border:1px solid var(--cizgi);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.gerek .et{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--soluk2)}
.gerek .min{font-size:13px;color:var(--soluk)}
.gerek .oner{font-size:14px;font-weight:700}

/* Form */
.form{display:flex;flex-direction:column;gap:18px;max-width:680px;margin:0 auto}
.form .p-bas h2{font-size:30px}
.alan{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#D5D9E1}
.alan input,.alan select{min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--cizgi2);background:var(--kart);color:var(--yazi);width:100%}
.alan select{padding:0 12px}
.alan input[aria-invalid="true"]{border-color:#FF6B7A}
.alan .hata{font-size:12px;color:#FF8A96;font-weight:600}
.kutu{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid var(--cizgi2);background:var(--kart)}
.kutu .ic{display:flex;flex-direction:column;gap:2px}
.kutu .ic b{font-size:14px}
.kutu .ic span{font-size:13px;color:var(--soluk)}
.secim{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid var(--cizgi2);background:var(--kart);cursor:pointer}
.secim.acik{border-color:var(--acc)}
.secim input{width:22px;height:22px;margin:0;accent-color:var(--acc);flex-shrink:0}
.secim b{display:block;font-size:15px;margin-bottom:4px}
.secim span{font-size:13px;line-height:1.5;color:var(--soluk)}
.sistem{margin:0;padding:18px;border:1px solid var(--cizgi2);border-radius:16px;display:flex;flex-direction:column;gap:14px;background:#0F1218}
.sistem legend{padding:0 8px;font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--acc)}
.cizgili{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:12px;background:#151922}
.cizgili ol{margin:0;padding-left:20px;font-size:13px;line-height:1.6;color:var(--soluk)}
.cizgili b{color:var(--yazi)}
.durum-yazi{font-size:13px;line-height:1.45;color:var(--soluk)}
.durum-yazi.iyi{color:var(--acc)}
.dosya{font-size:13px;color:var(--soluk)}
.dugme-acc{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--acc);background:transparent;color:var(--acc);font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}
.dugme-acc:disabled{opacity:.6;cursor:progress}
.uygunluk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--soluk)}
.uygunluk .hap{font-weight:800}
.u-ok{background:#123D2A!important;color:#3DD68C!important}
.u-mid{background:#3D3212!important;color:#F5C451!important}
.u-bad{background:#3D141B!important;color:#FF6B7A!important}
.onay{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.5;color:var(--soluk)}
.onay input{width:20px;height:20px;margin:0;accent-color:var(--acc);flex-shrink:0}
.onay button{border:0;background:none;padding:0;color:var(--acc);text-decoration:underline;cursor:pointer;font-size:13px}
.bal{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.form-hata{padding:12px 14px;border-radius:12px;border:1px solid #5A1F27;background:#2A1217;color:#FFB3BC;font-size:14px;line-height:1.5}
.tamam{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:40px 20px}
.tamam .ikon{width:64px;height:64px;border-radius:50%;background:var(--acc);color:#0A0B0F;display:flex;align-items:center;justify-content:center}
.tamam h2{margin:0;font-family:Unbounded,sans-serif;font-size:28px;font-weight:600}
.tamam p{margin:0;max-width:460px;font-size:15px;line-height:1.6;color:var(--soluk)}
.wa{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 22px;border-radius:14px;background:#1FAF5A;color:#fff;font-size:15px;font-weight:800;text-decoration:none}
.wa:hover{filter:brightness(1.08);color:#fff}
.kvkk-metin{font-size:14px;line-height:1.7;color:#C3C8D2;white-space:pre-line;max-width:760px}
.donen{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:don .8s linear infinite}
@keyframes don{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion:reduce){
  .hd-in,.mw-word,.cta-fx,.cta-fx::after,.canli-nokta,.ov,.panel,.etiket-canli i,.kiyas-sat .cubuk span{animation:none!important}
  .mw-mark path{animation:none;stroke-dashoffset:0}
}

/* Tablet */
@media (max-width:980px){
  .i4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .i3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .giris h1{font-size:32px}
}
/* Ortak yeni öğeler (masaüstü) */
.canli-cip{display:inline-flex;align-items:center;gap:8px;min-height:36px;margin-right:10px;padding:0 12px;border-radius:999px;border:1px solid rgba(229,36,59,.45);background:rgba(229,36,59,.12);color:#FFD5DA;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
.canli-cip:hover{background:rgba(229,36,59,.2)}
.dok,.kaydir-ipucu,.tutamac,.video-ad{display:none}

/* ================================================================
   Telefon (≤760px): alt menü + alttan açılan paneller
   ================================================================ */
@media (max-width:760px){
  :root{--dok-h:68px;--alt:env(safe-area-inset-bottom,0px)}
  body{overscroll-behavior:none}
  .kok{min-height:0}
  .sahne-isik{width:700px;height:520px;margin-left:-350px;margin-top:-330px;top:42%}

  /* Üst bar: ortada logo, sağda canlı çipi */
  .bas{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;grid-template-columns:1fr auto 1fr;gap:8px}
  .menu{display:none}
  .mw-logo{grid-column:2;gap:7px}
  .mw-logo .mw-mark{width:26px;height:26px}
  .mw-logo .mw-word{width:118px;height:7.4px}
  .bas-sag{grid-column:3}
  .bas-sag .cta{display:none}
  .canli-cip{margin:0;min-height:30px;padding:0 10px;font-size:11px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
  .ust-golge{height:120px}
  .onizleme-etiket{top:calc(64px + env(safe-area-inset-top,0px));bottom:auto;font-size:10px}

  /* Giriş metni */
  .giris{left:20px;right:20px;bottom:calc(var(--dok-h) + 30px + var(--alt));max-width:none;gap:10px}
  .rozet{font-size:11px;padding:5px 11px 5px 6px}
  .rozet-tik{width:18px;height:18px}
  .giris h1{font-size:27px;line-height:1.1;letter-spacing:-.025em}
  .giris p{font-size:13.5px;line-height:1.5;max-width:330px}
  .ipucu,.guven{display:none}
  .alt-golge{height:58vh;background:linear-gradient(rgba(7,8,11,0),rgba(7,8,11,.82) 42%,var(--bg) 78%)}
  .kaydir-ipucu{display:flex;position:absolute;left:50%;top:auto;bottom:calc(var(--dok-h) + 222px + var(--alt));transform:translateX(-50%);z-index:15;align-items:center;gap:10px;padding:7px 14px;border-radius:999px;background:rgba(14,16,22,.78);border:1px solid rgba(255,255,255,.1);font-size:12px;font-weight:700;color:#D5D9E1;pointer-events:none;transition:opacity .5s;white-space:nowrap}
  .kaydir-ipucu.gizli{opacity:0}
  .ok-sol,.ok-sag{width:7px;height:7px;border-left:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:rotate(45deg);animation:okSol 1.6s ease-in-out infinite}
  .ok-sag{transform:rotate(-135deg);animation-name:okSag}
  @keyframes okSol{50%{translate:-4px 0}}
  @keyframes okSag{50%{translate:4px 0}}

  /* Alt menü (dock) */
  .dok{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:absolute;z-index:40;left:12px;right:12px;bottom:calc(10px + var(--alt));height:var(--dok-h);padding:0 6px 8px;border-radius:22px;background:linear-gradient(180deg,rgba(26,29,38,.94),rgba(14,16,22,.96));border:1px solid rgba(255,255,255,.08);box-shadow:0 18px 40px -12px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.06)}
  .dok-btn,.dok-ana{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;padding:0;border:0;background:none;color:#9AA1AE;font-size:10.5px;font-weight:700;letter-spacing:.01em;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:color .2s}
  .dok-btn svg{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  .dok-btn:active svg{transform:scale(.88)}
  .dok-btn[aria-current]{color:var(--acc)}
  .dok-btn[aria-current]::before{content:'';position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--acc)}
  .dok-btn{position:relative}
  .dok-ana{color:var(--yazi)}
  .dok-ana-ic{width:54px;height:54px;margin-top:-22px;border-radius:18px;background:var(--acc);color:#0A0B0F;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -6px rgba(198,244,50,.55),inset 0 -2px 0 rgba(0,0,0,.15);transform:rotate(45deg);transition:transform .25s cubic-bezier(.2,.8,.2,1);animation:dokNabiz 3.2s ease-out 2s infinite}
  .dok-ana-ic svg{transform:rotate(-45deg)}
  .dok-ana:active .dok-ana-ic{transform:rotate(45deg) scale(.92)}
  .dok-ana[aria-current] .dok-ana-ic{transform:rotate(90deg)}
  @keyframes dokNabiz{0%{box-shadow:0 10px 24px -6px rgba(198,244,50,.55),0 0 0 0 rgba(198,244,50,.45)}70%,100%{box-shadow:0 10px 24px -6px rgba(198,244,50,.55),0 0 0 14px rgba(198,244,50,0)}}

  /* Alttan açılan panel (bottom sheet) */
  .ov{padding:0;align-items:flex-end;background:rgba(3,4,6,.72);-webkit-backdrop-filter:none;backdrop-filter:none;animation:fade .25s both;z-index:60}
  .ov.kapaniyor{animation:fadeOut .24s both}
  .ov.kapaniyor .panel{animation:sheetDown .24s cubic-bezier(.4,0,1,1) both}
  .panel{max-width:none;height:calc(100% - 22px - env(safe-area-inset-top,0px));max-height:none;border-radius:26px 26px 0 0;border:0;border-top:1px solid rgba(255,255,255,.09);padding:0 18px calc(28px + var(--alt));background:linear-gradient(180deg,#12151D 0,#0C0E14 220px);box-shadow:0 -30px 80px -20px rgba(0,0,0,.95);animation:sheetUp .42s cubic-bezier(.16,1,.3,1) both;transition:transform .3s cubic-bezier(.16,1,.3,1);will-change:transform}
  @keyframes sheetUp{from{transform:translate3d(0,100%,0)}}
  @keyframes sheetDown{to{transform:translate3d(0,100%,0)}}
  @keyframes fadeOut{to{opacity:0}}
  .tutamac{display:flex;position:sticky;top:0;z-index:9;justify-content:center;padding:10px 0 14px;margin:0 -18px;background:linear-gradient(#12151D 60%,rgba(18,21,29,0));touch-action:none}
  .tutamac span{width:40px;height:5px;border-radius:99px;background:rgba(255,255,255,.22)}
  .kapat{position:absolute;top:12px;right:14px;width:36px;height:36px;background:rgba(12,14,20,.72);border-color:rgba(255,255,255,.12)}
  .yay-video .etiketler{right:58px}
  .kapat svg{width:16px;height:16px}
  .ust-yazi{font-size:11px}
  .p-bas{padding-right:44px;gap:10px}
  .p-bas h2{font-size:25px;line-height:1.15;letter-spacing:-.02em}
  .p-bas p{font-size:15px;line-height:1.55}
  .dikey{gap:22px}
  .i2,.i3,.i4,.gerek{grid-template-columns:minmax(0,1fr)}
  .kart{padding:16px;border-radius:16px}
  .kart .bas2{font-size:16px}
  .cta.buyuk,.dugme2.buyuk{min-height:54px;border-radius:16px}
  .yapis-cta{position:sticky;bottom:calc(-28px - var(--alt));z-index:8;margin:0 -18px calc(-28px - var(--alt));padding:14px 18px calc(14px + var(--alt));background:linear-gradient(rgba(12,14,20,0),#0C0E14 35%)}

  /* Neden biz / adımlar: numaralı satır düzeni */
  .izgara.i3 .kart,.izgara.i4 .kart{display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:4px;align-items:start}
  .izgara.i3 .kart .no,.izgara.i4 .kart .adim-no{grid-row:span 2}
  .izgara.i3 .kart .no{font-size:20px;line-height:1.1;min-width:30px;color:transparent;-webkit-text-stroke:1px var(--acc)}
  .adim-no{width:30px;height:30px;font-size:13px}

  /* Kurucu */
  .kurucu{padding:16px;gap:16px;border-radius:18px}
  .kurucu-foto{flex:1 1 100%;flex-direction:row;align-items:center;gap:14px}
  .kurucu-foto .cerceve{width:84px;flex-shrink:0;border-radius:12px}
  .kurucu-metin h3{font-size:22px}
  .kurucu-metin p{font-size:14.5px}
  .zaman{display:flex;flex-direction:column;gap:0;padding-top:14px}
  .zaman li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;border-left:1px solid var(--cizgi2);margin-left:4px;padding-left:14px;position:relative}
  .zaman .yil{font-size:12px}
  .zaman .yil::before{position:absolute;left:-5px;top:12px}

  /* Yayıncı: kısa video + üzerinde ad, kaydırılabilir istatistikler */
  .yay{gap:18px}
  .yay-video-kol{flex:1 1 100%;min-width:0;gap:10px}
  .yay-video{width:100%;aspect-ratio:4/5;max-height:54vh;border-radius:20px;margin:0 auto}
  .yay-video::after{content:'';position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.78));pointer-events:none}
  .video-ad{display:flex;flex-direction:column;gap:2px;position:absolute;left:16px;right:64px;bottom:14px;z-index:2;font-size:12.5px;color:#D5D9E1;font-weight:600}
  .video-ad b{font-family:Unbounded,sans-serif;font-size:19px;font-weight:600;color:#fff;letter-spacing:-.01em;word-break:break-word}
  .yay-video .ses{z-index:3;bottom:14px;right:14px}
  .kesit-sec{justify-content:center}
  .yay-bilgi{flex:1 1 100%;gap:20px}
  .yay-bilgi > div:first-child{padding-right:0!important}
  .yay-bilgi h2{display:none}
  .ist-iz{display:flex!important;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none;gap:10px}
  .ist-iz::-webkit-scrollbar{display:none}
  .ist-iz .ist{flex:0 0 58%;scroll-snap-align:start}
  .km .t{width:58px}

  /* Oyun paketi: video üstte */
  .oyun{gap:20px}
  .oyun-video{order:-1;flex:1 1 100%;max-width:none;width:100%;aspect-ratio:16/10;margin:28px 0 0;border-radius:20px}
  .oyun-sol{flex:1 1 100%}
  .dahil{padding:12px 14px}

  /* Form */
  .form{gap:16px}
  .form .p-bas h2{font-size:25px}
  .tiktok-kutu{padding:12px 14px}
  .tiktok-kutu .ic span{display:none}
  .tiktok-kutu .ic b{font-size:13px;font-weight:700;color:var(--soluk)}
  .tiktok-kutu .dugme2{min-height:38px;padding:0 12px;font-size:13px}
  .form .izgara.i2{grid-template-columns:minmax(0,1fr)}
  .alan input,.alan select{min-height:50px;font-size:16px;border-radius:14px}
  .sistem{padding:14px}
  .tamam{padding:28px 4px}
  .tamam .wa{width:100%;justify-content:center}
}
@media (max-width:760px) and (prefers-reduced-motion:reduce){
  .panel,.ov,.dok-ana-ic,.ok-sol,.ok-sag{animation:none!important}
}
